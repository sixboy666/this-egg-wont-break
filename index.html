<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE8EC">
<title>EGG CATCH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#FFE8EC; }
  body { display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #stage { display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
/* ============================================================
   EGG CATCH
   A cute egg-catching arcade game. Move left/right, catch eggs,
   dodge bombs, build combos. 100% single file.
   ============================================================ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const maxW = 520;
  W = Math.min(window.innerWidth, maxW);
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();
(function waitForSize(){
  if (!(window.innerWidth>0 && window.innerHeight>0)) { setTimeout(resize, 100); setTimeout(waitForSize,100); }
  else if (!(W>0&&H>0)) resize();
})();
setTimeout(resize, 300);
setTimeout(resize, 1000);

/* ---------------- PASTEL PALETTE ---------------- */
const COL = {
  bgTop:    '#FFF0F3',
  bgMid:    '#FFE0E8',
  bgBot:    '#FFD4DD',
  eggShell: '#FFFFFF',
  eggShade: '#FFE0E8',
  eggYolk:  '#FFD93D',
  eggBlush: '#FFB3C6',
  gold:     '#FFD93D',
  goldShade:'#F0B429',
  heart:    '#FF6B9D',
  bomb:     '#4A4A5A',
  bombShade:'#2E2E3A',
  bombFuse: '#FF8C42',
  ink:      '#5A4A52',
  soft:     '#FFF5F8',
  cloud:    'rgba(255,255,255,0.7)',
  shadow:   'rgba(180,120,140,0.18)'
};

/* ---------------- GAME STATE ---------------- */
const STATE = { TITLE:0, PLAY:1, OVER:2 };
const game = {
  state: STATE.TITLE,
  score: 0,
  best: parseInt(localStorage.getItem('eggcatch_best')||'0',10) || 0,
  lives: 3,
  combo: 0,
  comboT: 0,
  time: 0,
  spawnT: 0,
  spawnInt: 1.1,
  speedK: 1,
  items: [],
  parts: [],
  puffs: [],
  shake: 0,
  flash: 0,
  t: 0,
  startY: 0
};

/* ---------------- PLAYER (CUTE EGG) ---------------- */
const player = {
  x: 0, y: 0, tx: 0,
  rx: 38, ry: 46,
  vx: 0,
  face: 'happy', faceT: 0,
  squash: 0
};
function resetPlayer() {
  player.x = W/2;
  player.tx = W/2;
  player.y = H - 90;
  player.vx = 0;
  player.face = 'happy';
  player.faceT = 0;
  player.squash = 0;
}

/* ---------------- INPUT ---------------- */
let pointerActive = false;
function setTargetX(px) {
  player.tx = Math.max(player.rx, Math.min(W-player.rx, px));
}
canvas.addEventListener('pointerdown', e=>{
  pointerActive = true;
  AU.init();
  if (game.state===STATE.TITLE) { startGame(); return; }
  if (game.state===STATE.OVER) { startGame(); return; }
  setTargetX(e.clientX - canvas.getBoundingClientRect().left);
});
canvas.addEventListener('pointermove', e=>{
  if (!pointerActive || game.state!==STATE.PLAY) return;
  setTargetX(e.clientX - canvas.getBoundingClientRect().left);
});
canvas.addEventListener('pointerup', ()=>{ pointerActive=false; });
canvas.addEventListener('pointercancel', ()=>{ pointerActive=false; });
// keyboard
window.addEventListener('keydown', e=>{
  if (game.state===STATE.TITLE || game.state===STATE.OVER) {
    if (e.code==='Space'||e.code==='Enter') { AU.init(); startGame(); }
    return;
  }
  if (e.code==='ArrowLeft'||e.code==='KeyA') player.tx = Math.max(player.rx, player.tx-60);
  if (e.code==='ArrowRight'||e.code==='KeyD') player.tx = Math.min(W-player.rx, player.tx+60);
});

/* ---------------- AUDIO ---------------- */
const AU = {
  ac:null, master:null, musicBus:null, sfxBus:null, muted:false,
  step:0, nextTime:0, startAt:0, timer:null,
  init() {
    if (this.ac) { if (this.ac.state==='suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = 0.85;
    const comp = this.ac.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=5;
    this.master.connect(comp); comp.connect(this.ac.destination);
    this.musicBus = this.ac.createGain(); this.musicBus.gain.value=0.35;
    this.sfxBus = this.ac.createGain(); this.sfxBus.gain.value=0.9;
    this.musicBus.connect(this.master); this.sfxBus.connect(this.master);
    this.noiseBuf = this.ac.createBuffer(1, this.ac.sampleRate*0.4, this.ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    this.step=0; this.nextTime=this.ac.currentTime+0.1; this.startAt=this.nextTime;
    this.timer = setInterval(()=>this.schedule(), 40);
  },
  beatDur() { return 60/100; },
  schedule() {
    if (!this.ac) return;
    const spb = this.beatDur();
    while (this.nextTime < this.ac.currentTime+0.2) {
      this.runStep(this.step, this.nextTime, spb);
      this.nextTime += spb;
      this.step = (this.step+1)%8;
    }
  },
  runStep(s,t,spb) {
    // soft kick on beat 0 and 4
    if (s===0||s===4) this.kick(t, 0.25);
    // gentle pluck melody
    const melody = [0,4,7,5,7,9,7,5];
    const semi = melody[s];
    this.pluck(t, 523.25*Math.pow(2,semi/12), spb*1.2, 0.12);
    // soft pad
    if (s===0) this.pad(t, spb*3.5, 0.06);
  },
  kick(t,vol) {
    if(!this.ac) return;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(55,t+0.1);
    g.gain.setValueAtTime((vol||0.3),t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.17);
  },
  pluck(t,f,dur,vol) {
    if(!this.ac) return;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*0.995,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+dur+0.03);
  },
  pad(t,dur,vol) {
    if(!this.ac) return;
    const freqs=[261.63,329.63,392.00];
    freqs.forEach(f=>{
      const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.1);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.musicBus);
      o.start(t); o.stop(t+dur+0.05);
    });
  },
  catch(perfect) {
    if(!this.ac) return;
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine';
    const f0 = perfect ? 880 : 660;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*1.5,t+0.1);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t+0.22);
  },
  gold() {
    if(!this.ac) return;
    const t=this.ac.currentTime;
    [880,1108,1318].forEach((f,i)=>{
      const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.06);
      g.gain.exponentialRampToValueAtTime(0.22,t+i*0.06+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.06+0.18);
      o.connect(g); g.connect(this.sfxBus);
      o.start(t+i*0.06); o.stop(t+i*0.06+0.2);
    });
  },
  heart() {
    if(!this.ac) return;
    const t=this.ac.currentTime;
    [523,659,784,1046].forEach((f,i)=>{
      const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.08);
      g.gain.exponentialRampToValueAtTime(0.2,t+i*0.08+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.3);
      o.connect(g); g.connect(this.sfxBus);
      o.start(t+i*0.08); o.stop(t+i*0.08+0.32);
    });
  },
  boom() {
    if(!this.ac) return;
    const t=this.ac.currentTime;
    const src=this.ac.createBufferSource(); src.buffer=this.noiseBuf;
    const f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(800,t);
    f.frequency.exponentialRampToValueAtTime(100,t+0.3);
    const g=this.ac.createGain();
    g.gain.setValueAtTime(0.5,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    src.connect(f); f.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t+0.4);
    const o=this.ac.createOscillator(),g2=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.3);
    g2.gain.setValueAtTime(0.4,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g2); g2.connect(this.sfxBus);
    o.start(t); o.stop(t+0.32);
  },
  over() {
    if(!this.ac) return;
    const t=this.ac.currentTime;
    [523,415,330,262].forEach((f,i)=>{
      const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.15);
      g.gain.exponentialRampToValueAtTime(0.2,t+i*0.15+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.15+0.4);
      o.connect(g); g.connect(this.sfxBus);
      o.start(t+i*0.15); o.stop(t+i*0.15+0.42);
    });
  }
};

/* ---------------- ITEMS (falling objects) ---------------- */
const ITEM_TYPES = ['egg','gold','heart','bomb'];
function spawnItem() {
  const r = Math.random();
  let type;
  const bombChance = Math.min(0.18 + game.speedK*0.02, 0.28);
  const heartChance = 0.06;
  const goldChance = 0.12;
  if (r < bombChance) type='bomb';
  else if (r < bombChance+heartChance) type='heart';
  else if (r < bombChance+heartChance+goldChance) type='gold';
  else type='egg';
  const margin = 30;
  const x = margin + Math.random()*(W-margin*2);
  const speed = (120 + game.speedK*40) * (0.85+Math.random()*0.3);
  game.items.push({
    type, x, y: -40,
    vy: speed,
    vx: (Math.random()-0.5)*30,
    r: type==='bomb'?24 : type==='heart'?20 : 22,
    rot: Math.random()*Math.PI*2,
    vr: (Math.random()-0.5)*3,
    caught:false
  });
}

/* ---------------- PARTICLES ---------------- */
function addPart(x,y,count,color,opts) {
  opts = opts||{};
  for (let i=0;i<count;i++) {
    const a = Math.random()*Math.PI*2;
    const sp = (opts.sp||120)*(0.4+Math.random()*0.8);
    game.parts.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (opts.up||0),
      life:0, max:opts.max||0.5,
      sz:opts.sz||(2+Math.random()*3),
      c:color, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*8,
      kind:opts.kind||'dot', gravity:opts.g!=null?opts.g:200
    });
  }
}
function addPuff(x,y,color) {
  game.puffs.push({x,y,r:4,maxR:28,life:0,max:0.4,c:color});
}

/* ---------------- GAME FLOW ---------------- */
function startGame() {
  game.state = STATE.PLAY;
  game.score = 0;
  game.lives = 3;
  game.combo = 0;
  game.comboT = 0;
  game.time = 0;
  game.spawnT = 0;
  game.spawnInt = 1.1;
  game.speedK = 1;
  game.items.length = 0;
  game.parts.length = 0;
  game.puffs.length = 0;
  game.shake = 0;
  game.flash = 0;
  resetPlayer();
}
function gameOver() {
  game.state = STATE.OVER;
  if (game.score > game.best) {
    game.best = game.score;
    localStorage.setItem('eggcatch_best', String(game.best));
  }
  AU.over();
}

/* ---------------- UPDATE ---------------- */
function update(dt) {
  if (game.state !== STATE.PLAY) return;
  game.time += dt;
  game.speedK = 1 + game.time*0.025;
  game.spawnInt = Math.max(0.45, 1.1 - game.time*0.012);

  // player
  const dx = player.tx - player.x;
  player.vx = dx * 14;
  player.x += player.vx * dt;
  player.squash += (0 - player.squash) * Math.min(1, dt*8);
  player.faceT -= dt;
  if (player.faceT <= 0) player.face = 'happy';

  // spawn
  game.spawnT += dt;
  if (game.spawnT >= game.spawnInt) {
    game.spawnT = 0;
    spawnItem();
  }

  // items
  for (let i=game.items.length-1; i>=0; i--) {
    const it = game.items[i];
    it.y += it.vy * game.speedK * dt;
    it.x += it.vx * dt;
    it.rot += it.vr * dt;
    if (it.x < it.r) { it.x=it.r; it.vx=Math.abs(it.vx); }
    if (it.x > W-it.r) { it.x=W-it.r; it.vx=-Math.abs(it.vx); }

    // collision with player (catch zone: top of egg)
    const catchY = player.y - player.ry*0.6;
    const dx2 = it.x - player.x;
    const dy2 = it.y - catchY;
    if (Math.abs(dx2) < player.rx*0.9 + it.r*0.3 && it.y > catchY - it.r && it.y < catchY + player.ry*0.5) {
      it.caught = true;
      handleCatch(it);
      game.items.splice(i,1);
      continue;
    }
    // missed / fell off
    if (it.y > H + 50) {
      if (it.type==='egg' || it.type==='gold') {
        game.combo = 0;
        game.comboT = 0;
      }
      game.items.splice(i,1);
    }
  }

  // particles
  for (let i=game.parts.length-1;i>=0;i--) {
    const p = game.parts[i];
    p.life += dt;
    if (p.life >= p.max) { game.parts.splice(i,1); continue; }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
  }
  // puffs
  for (let i=game.puffs.length-1;i>=0;i--) {
    const p = game.puffs[i];
    p.life += dt;
    if (p.life >= p.max) { game.puffs.splice(i,1); continue; }
    p.r = 4 + (p.maxR-4) * (p.life/p.max);
  }

  // combo timer
  if (game.combo > 0) {
    game.comboT -= dt;
    if (game.comboT <= 0) game.combo = 0;
  }
  // shake/flash decay
  game.shake *= Math.pow(0.001, dt);
  game.flash = Math.max(0, game.flash - dt*2);
}

function handleCatch(it) {
  const cx = it.x, cy = it.y;
  if (it.type==='bomb') {
    game.lives--;
    game.combo = 0;
    game.comboT = 0;
    game.shake = 12;
    game.flash = 0.5;
    AU.boom();
    if (navigator.vibrate) navigator.vibrate(30);
    addPart(cx, cy, 18, COL.bomb, {sp:220, up:60, max:0.6, sz:3});
    addPart(cx, cy, 8, '#FF8C42', {sp:160, up:80, max:0.5, sz:4});
    player.face = 'ouch'; player.faceT = 0.6;
    player.squash = -0.15;
    if (game.lives <= 0) gameOver();
  } else if (it.type==='heart') {
    game.lives = Math.min(5, game.lives+1);
    AU.heart();
    addPart(cx, cy, 14, COL.heart, {sp:160, up:40, max:0.7, sz:3, kind:'heart'});
    addPuff(cx, cy, COL.heart);
    player.face = 'love'; player.faceT = 0.8;
  } else if (it.type==='gold') {
    const pts = 5 + Math.floor(game.combo*0.5);
    game.score += pts;
    game.combo++;
    game.comboT = 2.2;
    AU.gold();
    addPart(cx, cy, 20, COL.gold, {sp:200, up:50, max:0.7, sz:3, kind:'star'});
    addPart(cx, cy, 10, '#FFF', {sp:140, up:40, max:0.5, sz:2});
    addPuff(cx, cy, COL.gold);
    player.squash = 0.18;
    player.face = 'wow'; player.faceT = 0.5;
    if (navigator.vibrate) navigator.vibrate(12);
  } else { // egg
    const perfect = Math.abs(it.x - player.x) < player.rx*0.4;
    const pts = (perfect ? 2 : 1) * (1 + Math.floor(game.combo*0.3));
    game.score += pts;
    game.combo++;
    game.comboT = 2.0;
    AU.catch(perfect);
    addPart(cx, cy, perfect?12:7, perfect?COL.gold:COL.soft, {sp:160, up:50, max:0.5, sz:2.5});
    if (perfect) addPuff(cx, cy, COL.gold);
    player.squash = perfect?0.14:0.08;
    player.face = perfect?'wow':'happy'; player.faceT = 0.35;
    if (navigator.vibrate) navigator.vibrate(6);
  }
}

/* ---------------- RENDERING ---------------- */
function drawBG() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, COL.bgTop);
  g.addColorStop(0.5, COL.bgMid);
  g.addColorStop(1, COL.bgBot);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // soft floating clouds
  ctx.fillStyle = COL.cloud;
  for (let i=0;i<5;i++) {
    const cx = ((i*137 + game.t*12) % (W+120)) - 60;
    const cy = 60 + i*90;
    cloud(cx, cy, 30+i*4);
  }
  // ground shadow band
  const gg = ctx.createLinearGradient(0,H-60,0,H);
  gg.addColorStop(0,'rgba(255,180,200,0)');
  gg.addColorStop(1,'rgba(255,160,180,0.25)');
  ctx.fillStyle = gg;
  ctx.fillRect(0,H-60,W,60);
}
function cloud(x,y,r) {
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,Math.PI*2);
  ctx.arc(x+r*0.7,y+4,r*0.5,0,Math.PI*2);
  ctx.arc(x-r*0.7,y+4,r*0.5,0,Math.PI*2);
  ctx.arc(x,y+6,r*0.55,0,Math.PI*2);
  ctx.fill();
}

function drawEgg(x,y,rx,ry,shell,shade,face,rot,squash) {
  const sx = 1 + (squash||0);
  const sy = 1 - (squash||0)*0.7;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot||0);
  ctx.scale(sx,sy);
  // shadow
  ctx.fillStyle = COL.shadow;
  ctx.beginPath();
  ctx.ellipse(0, ry*0.95, rx*0.8, ry*0.18, 0, 0, Math.PI*2);
  ctx.fill();
  // body
  const grd = ctx.createLinearGradient(0,-ry,0,ry);
  grd.addColorStop(0, shell);
  grd.addColorStop(1, shade);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.fill();
  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-rx*0.3,-ry*0.35,rx*0.28,ry*0.18,-0.4,0,Math.PI*2);
  ctx.fill();
  // face
  drawFace(0,0,rx,ry,face);
  ctx.restore();
}

function drawFace(ox,oy,rx,ry,face) {
  const eyeY = -ry*0.1;
  const eyeX = rx*0.32;
  // blush
  ctx.fillStyle = COL.eggBlush;
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.ellipse(-eyeX*1.1, ry*0.18, rx*0.16, ry*0.08, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeX*1.1, ry*0.18, rx*0.16, ry*0.08, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // eyes
  ctx.fillStyle = COL.ink;
  if (face==='wow') {
    ctx.beginPath(); ctx.arc(-eyeX, eyeY, rx*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeX, eyeY, rx*0.1, 0, Math.PI*2); ctx.fill();
    // open mouth
    ctx.fillStyle = COL.eggBlush;
    ctx.beginPath(); ctx.ellipse(0, ry*0.28, rx*0.12, ry*0.1, 0, 0, Math.PI*2); ctx.fill();
  } else if (face==='love') {
    heart(-eyeX, eyeY, rx*0.11);
    heart(eyeX, eyeY, rx*0.11);
    ctx.strokeStyle = COL.heart; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0, ry*0.25, rx*0.1, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
  } else if (face==='ouch') {
    ctx.lineWidth = 2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-eyeX-rx*0.08, eyeY-ry*0.06); ctx.lineTo(-eyeX+rx*0.08, eyeY+ry*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-eyeX-rx*0.08, eyeY+ry*0.06); ctx.lineTo(-eyeX+rx*0.08, eyeY-ry*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeX-rx*0.08, eyeY-ry*0.06); ctx.lineTo(eyeX+rx*0.08, eyeY+ry*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeX-rx*0.08, eyeY+ry*0.06); ctx.lineTo(eyeX+rx*0.08, eyeY-ry*0.06); ctx.stroke();
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.ellipse(0, ry*0.3, rx*0.1, ry*0.06, 0, 0, Math.PI*2); ctx.fill();
  } else { // happy
    ctx.beginPath(); ctx.arc(-eyeX, eyeY, rx*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeX, eyeY, rx*0.08, 0, Math.PI*2); ctx.fill();
    // smile
    ctx.strokeStyle = COL.ink; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0, ry*0.18, rx*0.22, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  }
}
function heart(x,y,s) {
  ctx.fillStyle = COL.heart;
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x, y, x-s, y, x-s, y+s*0.3);
  ctx.bezierCurveTo(x-s, y+s*0.6, x, y+s*0.85, x, y+s*0.85);
  ctx.bezierCurveTo(x, y+s*0.85, x+s, y+s*0.6, x+s, y+s*0.3);
  ctx.bezierCurveTo(x+s, y, x, y, x, y+s*0.3);
  ctx.fill();
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);
  if (it.type==='egg') {
    drawEgg(0,0,it.r,it.r*1.25,COL.eggShell,COL.eggShade,'happy',0,0);
  } else if (it.type==='gold') {
    drawEgg(0,0,it.r,it.r*1.25,COL.gold,COL.goldShade,'wow',0,0);
    // sparkles
    ctx.fillStyle = '#FFF';
    const t = game.t*4;
    for (let i=0;i<3;i++) {
      const a = t + i*2.1;
      const rr = it.r*0.9;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr, 2, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (it.type==='heart') {
    heart(0,0,it.r*0.9);
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(-it.r*0.3, -it.r*0.2, it.r*0.18, it.r*0.1, -0.5, 0, Math.PI*2);
    ctx.fill();
  } else if (it.type==='bomb') {
    // body
    const grd = ctx.createRadialGradient(-it.r*0.3,-it.r*0.3,2,0,0,it.r);
    grd.addColorStop(0,'#6A6A7A');
    grd.addColorStop(1,COL.bombShade);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0,0,it.r,0,Math.PI*2);
    ctx.fill();
    // fuse
    ctx.strokeStyle = COL.bombFuse; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(it.r*0.4,-it.r*0.6);
    ctx.quadraticCurveTo(it.r*0.9,-it.r*1.1, it.r*0.6,-it.r*1.3);
    ctx.stroke();
    // spark
    const sp = 3+Math.sin(game.t*20)*2;
    ctx.fillStyle = '#FFE066';
    ctx.beginPath(); ctx.arc(it.r*0.6,-it.r*1.35,sp,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(it.r*0.6,-it.r*1.35,sp*0.5,0,Math.PI*2); ctx.fill();
    // eyes (angry)
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(-it.r*0.3,-it.r*0.1,it.r*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(it.r*0.3,-it.r*0.1,it.r*0.22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF4444';
    ctx.beginPath(); ctx.arc(-it.r*0.3,-it.r*0.1,it.r*0.11,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(it.r*0.3,-it.r*0.1,it.r*0.11,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawParts() {
  for (const p of game.parts) {
    const a = 1 - p.life/p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.kind==='heart') {
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      heart(0,0,p.sz*2);
      ctx.restore();
    } else if (p.kind==='star') {
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      star(0,0,p.sz*1.5,p.sz*0.7,5);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function star(cx,cy,r1,r2,n) {
  ctx.beginPath();
  for (let i=0;i<n*2;i++) {
    const r = i%2?r2:r1;
    const a = -Math.PI/2 + i*Math.PI/n;
    const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function drawPuffs() {
  for (const p of game.puffs) {
    const a = 1 - p.life/p.max;
    ctx.globalAlpha = a*0.5;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // top bar
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  roundRect(12, 12, W-24, 56, 18);
  ctx.fill();
  // score
  ctx.fillStyle = COL.ink;
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(game.score), 26, 40);
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = COL.ink+'99';
  ctx.fillText('SCORE', 26, 56);
  // combo
  if (game.combo > 1) {
    ctx.fillStyle = COL.goldShade;
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x'+game.combo, W/2, 36);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = COL.ink+'99';
    ctx.fillText('COMBO', W/2, 56);
  }
  // lives
  for (let i=0;i<5;i++) {
    const lx = W-30-i*22, ly = 40;
    if (i < game.lives) {
      ctx.fillStyle = COL.heart;
      heart(lx, ly, 8);
    } else {
      ctx.strokeStyle = COL.heart+'88'; ctx.lineWidth=1.5;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      heart(lx, ly, 8);
      ctx.globalAlpha=0.4;
      ctx.beginPath();
      ctx.arc(lx,ly,9,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  // best small
  ctx.textAlign = 'left';
  ctx.fillStyle = COL.ink+'88';
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('BEST '+game.best, 26, 72);
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawTitle() {
  drawBG();
  // big egg
  const bob = Math.sin(game.t*2)*8;
  drawEgg(W/2, H*0.36+bob, 56, 72, COL.eggShell, COL.eggShade, 'happy', 0, Math.sin(game.t*4)*0.04);
  // title text
  ctx.textAlign='center';
  ctx.fillStyle = COL.ink;
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('EGG CATCH', W/2, H*0.55);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = COL.ink+'AA';
  ctx.fillText('Catch the eggs. Dodge the bombs.', W/2, H*0.55+28);
  // tap hint
  const pulse = 0.5+0.5*Math.sin(game.t*3);
  ctx.globalAlpha = 0.5+0.5*pulse;
  ctx.fillStyle = COL.ink;
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillText('TAP TO PLAY', W/2, H*0.72);
  ctx.globalAlpha = 1;
  // best
  if (game.best>0) {
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = COL.goldShade;
    ctx.fillText('BEST: '+game.best, W/2, H*0.82);
  }
}

function drawOver() {
  // dim
  ctx.fillStyle = 'rgba(90,74,82,0.55)';
  ctx.fillRect(0,0,W,H);
  // card
  ctx.fillStyle = COL.soft;
  roundRect(W*0.12, H*0.25, W*0.76, H*0.5, 28);
  ctx.fill();
  // title
  ctx.textAlign='center';
  ctx.fillStyle = COL.ink;
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.fillText('GAME OVER', W/2, H*0.25+60);
  // score
  ctx.font = 'bold 48px system-ui, sans-serif';
  ctx.fillStyle = COL.goldShade;
  ctx.fillText(String(game.score), W/2, H*0.25+120);
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = COL.ink+'99';
  ctx.fillText('SCORE', W/2, H*0.25+145);
  // best
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = COL.ink;
  const isNew = game.score >= game.best && game.score>0;
  ctx.fillText(isNew ? '✨ NEW BEST! ✨' : 'Best: '+game.best, W/2, H*0.25+180);
  // tap hint
  const pulse = 0.5+0.5*Math.sin(game.t*3);
  ctx.globalAlpha = 0.5+0.5*pulse;
  ctx.fillStyle = COL.ink;
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillText('TAP TO PLAY AGAIN', W/2, H*0.25+230);
  ctx.globalAlpha = 1;
}

function render() {
  game.t += 0.016;
  ctx.save();
  // shake
  if (game.shake > 0.2) {
    ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  }
  drawBG();
  if (game.state===STATE.TITLE) {
    drawTitle();
    ctx.restore();
    return;
  }
  // puffs behind items
  drawPuffs();
  // items
  for (const it of game.items) drawItem(it);
  // player
  drawEgg(player.x, player.y, player.rx, player.ry, COL.eggShell, COL.eggShade, player.face, 0, player.squash);
  // particles
  drawParts();
  // flash
  if (game.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,255,255,'+game.flash*0.6+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  // HUD (no shake)
  if (game.state===STATE.PLAY) drawHUD();
  if (game.state===STATE.OVER) drawOver();
}

/* ---------------- LOOP ---------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last)/1000;
  last = now;
  dt = Math.min(dt, 0.033);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
